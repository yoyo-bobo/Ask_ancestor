<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>周易六爻 · 白话解卦</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --gold:#c9a961;
    --gold-light:#e8cf94;
    --gold-dim:#8a7444;
    --red:#a8342a;
    --paper:#d8cfbc;
  }

  body{
    min-height:100vh;
    background:#0d0b08;
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(201,169,97,.13), transparent 55%),
      radial-gradient(ellipse at 50% 115%, rgba(201,169,97,.07), transparent 55%);
    color:var(--paper);
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    padding:36px 16px 70px;
    display:flex;
    justify-content:center;
  }

  .app{ width:100%; max-width:600px; }

  /* ---------- 标题 ---------- */
  header{ text-align:center; margin-bottom:28px; }
  header h1{
    font-size:30px;
    letter-spacing:.5em;
    text-indent:.5em;
    font-weight:400;
    color:var(--gold-light);
    text-shadow:0 0 24px rgba(201,169,97,.35);
  }
  header .sub{
    margin-top:10px;
    font-size:12px;
    letter-spacing:.35em;
    text-indent:.35em;
    color:var(--gold-dim);
  }
  header .rule{
    width:70px; height:1px; margin:16px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);
  }

  /* ---------- 问题输入 ---------- */
  .ask{ margin-bottom:16px; }
  .ask input{
    width:100%;
    background:rgba(201,169,97,.04);
    border:1px solid rgba(201,169,97,.22);
    border-radius:3px;
    padding:13px 16px;
    color:var(--paper);
    font-family:inherit;
    font-size:14px;
    letter-spacing:.08em;
    outline:none;
    transition:border-color .25s, background .25s;
  }
  .ask input::placeholder{ color:rgba(201,169,97,.32); }
  .ask input:focus{
    border-color:rgba(201,169,97,.55);
    background:rgba(201,169,97,.07);
  }

  /* ---------- 类别选择 ---------- */
  .categories{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
  }
  .cat-btn{
    flex:1 0 auto;
    padding:9px 4px;
    background:transparent;
    border:1px solid rgba(201,169,97,.22);
    border-radius:3px;
    color:var(--gold-dim);
    font-family:inherit;
    font-size:13px;
    letter-spacing:.15em;
    cursor:pointer;
    transition:all .22s;
    white-space:nowrap;
  }
  .cat-btn:hover{
    border-color:rgba(201,169,97,.5);
    color:var(--gold-light);
  }
  .cat-btn.active{
    border-color:var(--gold);
    color:#f5e5bb;
    background:rgba(201,169,97,.12);
    box-shadow:0 0 16px rgba(201,169,97,.15);
  }

  /* ---------- 铜钱 ---------- */
  .coins{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-bottom:24px;
    padding:16px 0 6px;
  }
  .coin-wrap{ display:flex; flex-direction:column; align-items:center; gap:9px; }
  .coin{
    width:78px; height:78px;
    border-radius:50%;
    position:relative;
    display:grid; place-items:center;
    background:radial-gradient(circle at 34% 28%, #f4e3b6, #c9a961 42%, #6f5a2e 100%);
    box-shadow:
      0 7px 20px rgba(0,0,0,.65),
      inset 0 2px 6px rgba(255,255,255,.38),
      inset 0 -4px 10px rgba(0,0,0,.4);
    will-change:transform;
  }
  .coin .hole{
    width:25px; height:25px;
    background:#0d0b08;
    box-shadow:inset 0 0 8px rgba(0,0,0,.95), 0 0 0 2px rgba(0,0,0,.3);
  }
  .coin .glyph{
    position:absolute;
    font-size:11px;
    font-weight:700;
    color:#4d3f1d;
    opacity:0;
    transition:opacity .22s;
    text-shadow:0 1px 0 rgba(255,255,255,.3);
    pointer-events:none;
  }
  .coin[data-side="front"] .glyph{ opacity:1; }
  .glyph.t{ top:7px;  left:50%; transform:translateX(-50%); }
  .glyph.b{ bottom:7px; left:50%; transform:translateX(-50%); }
  .glyph.l{ left:8px;  top:50%; transform:translateY(-50%); }
  .glyph.r{ right:8px; top:50%; transform:translateY(-50%); }
  .coin-tag{
    font-size:11px;
    letter-spacing:.2em;
    color:var(--gold-dim);
    height:14px;
    transition:color .25s;
  }
  .coin-tag.on{ color:var(--gold-light); }

  @keyframes toss{
    0%  { transform:translateY(0)      rotate(0deg)   scale(1); }
    28% { transform:translateY(-30px)  rotate(-190deg) scale(1.06); }
    55% { transform:translateY(-44px)  rotate(-330deg) scale(1.02); }
    80% { transform:translateY(-12px)  rotate(-420deg) scale(.98); }
    100%{ transform:translateY(0)      rotate(-540deg) scale(1); }
  }

  /* ---------- 按钮 ---------- */
  .cast-btn{
    display:block;
    width:100%;
    padding:15px;
    background:transparent;
    border:1px solid rgba(201,169,97,.45);
    border-radius:3px;
    color:var(--gold-light);
    font-family:inherit;
    font-size:16px;
    letter-spacing:.5em;
    text-indent:.5em;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:all .3s;
  }
  .cast-btn::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(201,169,97,.18),transparent);
    transform:translateX(-100%);
    transition:transform .6s;
  }
  .cast-btn:hover:not(:disabled)::after{ transform:translateX(100%); }
  .cast-btn:hover:not(:disabled){
    border-color:var(--gold);
    color:#f5e5bb;
    box-shadow:0 0 26px rgba(201,169,97,.22);
  }
  .cast-btn:disabled{
    opacity:.42;
    cursor:not-allowed;
    letter-spacing:.3em;
  }

  /* ---------- 卦盘 ---------- */
  .board{
    display:flex;
    flex-direction:column;
    gap:15px;
    align-items:center;
    margin:32px 0 26px;
  }
  .yao-row{
    display:grid;
    grid-template-columns:118px 50px;
    gap:18px;
    align-items:center;
  }
  .yao-slot{ display:flex; justify-content:center; }
  .placeholder{
    width:118px; height:10px;
    border-radius:2px;
    background:rgba(201,169,97,.07);
  }
  .yao{
    display:flex;
    gap:11px;
    width:118px;
    height:10px;
    animation:yaoIn .38s cubic-bezier(.2,1.3,.5,1);
  }
  @keyframes yaoIn{
    0%  { opacity:0; transform:scaleX(.2); }
    100%{ opacity:1; transform:scaleX(1); }
  }
  .yao .bar{
    flex:1;
    border-radius:2px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    box-shadow:0 0 12px rgba(201,169,97,.3);
  }
  .yao.changing .bar{
    background:linear-gradient(180deg,#e0705f,var(--red));
    box-shadow:0 0 16px rgba(168,52,42,.65);
    animation:breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ opacity:1; }
    50%    { opacity:.6; }
  }
  .yao-label{
    font-size:13px;
    color:var(--gold-dim);
    letter-spacing:.08em;
    white-space:nowrap;
  }
  .yao-label.changing{ color:var(--red); }

  /* ---------- 结果 ---------- */
  .result{ display:flex; flex-direction:column; gap:14px; }

  .question-echo{
    text-align:center;
    font-size:14px;
    color:var(--gold-dim);
    letter-spacing:.1em;
    margin-bottom:6px;
    line-height:1.9;
  }
  .question-echo strong{ color:var(--gold-light); font-weight:400; }

  .card{
    border:1px solid rgba(201,169,97,.22);
    border-radius:3px;
    padding:18px 20px 20px;
    background:linear-gradient(180deg, rgba(201,169,97,.055), rgba(201,169,97,.012));
    animation:cardIn .5s ease both;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(14px); }
    to  { opacity:1; transform:translateY(0); }
  }

  .card-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding-bottom:10px;
    border-bottom:1px solid rgba(201,169,97,.15);
    margin-bottom:12px;
  }
  .card-title{
    font-size:22px;
    color:var(--gold-light);
    letter-spacing:.16em;
  }
  .card-num{
    font-size:12px;
    color:var(--gold-dim);
    letter-spacing:.12em;
    white-space:nowrap;
  }
  .card-tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:.2em;
    padding:3px 9px;
    border:1px solid rgba(201,169,97,.3);
    border-radius:2px;
    color:var(--gold-dim);
    margin-bottom:12px;
  }
  .card-tag.red{
    border-color:rgba(168,52,42,.5);
    color:#c86058;
  }
  .card-text{
    font-size:15px;
    line-height:1.95;
    letter-spacing:.05em;
    color:#c8bfab;
  }

  .direct-badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 14px;
    border-radius:2px;
    font-size:14px;
    letter-spacing:.15em;
  }
  .direct-badge.good{ background:rgba(201,169,97,.15); color:var(--gold-light); border:1px solid rgba(201,169,97,.4); }
  .direct-badge.mid{ background:rgba(201,169,97,.08); color:var(--gold-dim); border:1px solid rgba(201,169,97,.25); }
  .direct-badge.bad{ background:rgba(168,52,42,.12); color:#d4736a; border:1px solid rgba(168,52,42,.45); }

  .category-advice{
    margin-top:14px;
    padding:12px 14px;
    border-left:2px solid rgba(201,169,97,.4);
    background:rgba(201,169,97,.04);
    font-size:14px;
    line-height:1.95;
    color:#c8bfab;
    letter-spacing:.05em;
  }

  .changing-note{
    font-size:13px;
    color:#c86058;
    letter-spacing:.08em;
    line-height:1.9;
    padding:10px 14px;
    border-left:2px solid rgba(168,52,42,.5);
    background:rgba(168,52,42,.06);
  }

  .arrows{
    text-align:center;
    color:var(--gold-dim);
    font-size:18px;
    letter-spacing:.6em;
    text-indent:.6em;
    margin:-2px 0;
  }

  footer{
    text-align:center;
    margin-top:44px;
    font-size:11px;
    letter-spacing:.2em;
    color:rgba(201,169,97,.22);
    line-height:2;
  }

  @media (max-width:420px){
    .coin{ width:64px; height:64px; }
    .coin .hole{ width:21px; height:21px; }
    .coin .glyph{ font-size:9px; }
    .glyph.t{ top:5px; } .glyph.b{ bottom:5px; }
    .glyph.l{ left:6px; } .glyph.r{ right:6px; }
    .coins{ gap:14px; }
    .yao-row{ grid-template-columns:96px 46px; gap:12px; }
    .yao, .placeholder{ width:96px; }
    header h1{ font-size:24px; }
    .cat-btn{ font-size:12px; padding:8px 2px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>周易六爻</h1>
    <p class="sub">铜钱起卦 · 白话解卦</p>
    <div class="rule"></div>
  </header>

  <div class="ask">
    <input id="question" maxlength="40" placeholder="写下你所问之事（可留空）">
  </div>

  <div class="categories" id="categories">
    <button class="cat-btn" data-cat="career">事业</button>
    <button class="cat-btn" data-cat="love">感情</button>
    <button class="cat-btn" data-cat="wealth">财运</button>
    <button class="cat-btn" data-cat="health">健康</button>
    <button class="cat-btn" data-cat="study">学业</button>
    <button class="cat-btn active" data-cat="other">综合</button>
  </div>

  <div class="coins" id="coins">
    <div class="coin-wrap">
      <div class="coin" data-side="back">
        <div class="hole"></div>
        <span class="glyph t">乾</span><span class="glyph r">隆</span>
        <span class="glyph b">通</span><span class="glyph l">宝</span>
      </div>
      <div class="coin-tag">—</div>
    </div>
    <div class="coin-wrap">
      <div class="coin" data-side="back">
        <div class="hole"></div>
        <span class="glyph t">乾</span><span class="glyph r">隆</span>
        <span class="glyph b">通</span><span class="glyph l">宝</span>
      </div>
      <div class="coin-tag">—</div>
    </div>
    <div class="coin-wrap">
      <div class="coin" data-side="back">
        <div class="hole"></div>
        <span class="glyph t">乾</span><span class="glyph r">隆</span>
        <span class="glyph b">通</span><span class="glyph l">宝</span>
      </div>
      <div class="coin-tag">—</div>
    </div>
  </div>

  <button class="cast-btn" id="castBtn">摇 卦</button>

  <div class="board" id="board"></div>
  <div class="result" id="result"></div>

  <footer>
    六爻成卦 · 白话直断<br>
    仅供参考 · 事在人为
  </footer>

</div>

   plain: 白话总结（一句）

/* ==========================================================

/* ==========================================================
   三、爻象定义
   ========================================================== */
const YAO = {
  6: { name:"老阴", yang:false, changing:true  },  // 三字
  7: { name:"少阳", yang:true,  changing:false },  // 一背两字
  8: { name:"少阴", yang:false, changing:false },  // 两背一字
  9: { name:"老阳", yang:true,  changing:true  }   // 三背
};

const POS_NAME = ["初","二","三","四","五","上"];
const CN_NUM = ["零","一","二","三","四","五","六","七","八","九"];

function cnNum(n){
  if (n <= 10) return CN_NUM[n];
  if (n < 20)  return "十" + (n % 10 ? CN_NUM[n % 10] : "");
  return CN_NUM[Math.floor(n / 10)] + "十" + (n % 10 ? CN_NUM[n % 10] : "");
}

function yaoName(idx, isYang){
  const y = isYang ? "九" : "六";
  if (idx === 0) return "初" + y;
  if (idx === 5) return "上" + y;
  return y + POS_NAME[idx];
}

/* 根据等级返回直断徽章样式 */
function levelClass(level){
  if (level === "吉") return "good";
  if (level === "凶") return "bad";
  return "mid";
}

/* ==========================================================
   四、DOM 与状态
   ========================================================== */
const boardEl    = document.getElementById("board");
const resultEl   = document.getElementById("result");
const castBtn    = document.getElementById("castBtn");
const questionEl = document.getElementById("question");
const coinEls    = [...document.querySelectorAll(".coin")];
const coinTags   = [...document.querySelectorAll(".coin-tag")];
const catBtns    = [...document.querySelectorAll(".cat-btn")];

const state = { casts: [], busy: false, category: "other" };

/* 初始化卦盘（六行，从上爻到初爻） */
for (let i = 5; i >= 0; i--){
  const row = document.createElement("div");
  row.className = "yao-row";
  row.dataset.idx = i;
  row.innerHTML = `
    <div class="yao-slot"><div class="placeholder"></div></div>
    <div class="yao-label">&nbsp;</div>
  `;
  boardEl.appendChild(row);
}

/* ==========================================================
   五、类别选择
   ========================================================== */
catBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    if (state.busy) return;
    catBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.category = btn.dataset.cat;
  });
});

/* ==========================================================
   六、摇卦核心
   ========================================================== */
function tossCoins(){
  const vals = [0,0,0].map(() => Math.random() < 0.5 ? 3 : 2);
  return { vals, sum: vals.reduce((a,b) => a + b, 0) };
}

function animateCoins(){
  coinEls.forEach((c, i) => {
    c.style.animation = "none";
    void c.offsetWidth;
    c.style.animation = `toss .62s ${i * 0.09}s cubic-bezier(.3,.1,.4,1) both`;
  });
  coinTags.forEach(t => {
    t.textContent = "—";
    t.classList.remove("on");
  });
}

function showCoins(vals){
  vals.forEach((v, i) => {
    const isBack = v === 3;
    coinEls[i].dataset.side = isBack ? "back" : "front";
    coinTags[i].textContent = isBack ? "背" : "字";
    coinTags[i].classList.toggle("on", true);
  });
}

function drawYao(idx, sum){
  const y   = YAO[sum];
  const row = boardEl.querySelector(`[data-idx="${idx}"]`);
  const slot = row.querySelector(".yao-slot");
  const label = row.querySelector(".yao-label");

  const bars = y.yang
    ? '<i class="bar"></i>'
    : '<i class="bar"></i><i class="bar"></i>';

  slot.innerHTML = `<div class="yao ${y.changing ? "changing" : ""}">${bars}</div>`;

  label.textContent = yaoName(idx, y.yang);
  label.classList.toggle("changing", y.changing);
}

async function startCast(){
  if (state.busy) return;
  state.busy = true;
  state.casts = [];
  castBtn.disabled = true;
  castBtn.textContent = "起 卦 中";
  resultEl.innerHTML = "";

  boardEl.querySelectorAll(".yao-slot").forEach(s => {
    s.innerHTML = '<div class="placeholder"></div>';
  });
  boardEl.querySelectorAll(".yao-label").forEach(l => {
    l.innerHTML = "&nbsp;";
    l.classList.remove("changing");
  });

  for (let i = 0; i < 6; i++){
    animateCoins();
    await sleep(700);

    const { vals, sum } = tossCoins();
    showCoins(vals);
    drawYao(i, sum);

    state.casts.push({
      sum,
      yang: YAO[sum].yang,
      changing: YAO[sum].changing
    });

    await sleep(260);
  }

  showResult();

  state.busy = false;
  castBtn.disabled = false;
  castBtn.textContent = "重 新 起 卦";
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ==========================================================
   七、解卦（白话 + 类别针对性）
   ========================================================== */
function showResult(){
  const yaos = state.casts;
  const cat  = state.category;
  const catName = CATEGORY_NAME[cat];

  // 本卦
  const benKey = yaos.map(y => y.yang ? "1" : "0").join("");
  const ben = HEX[benKey];

  // 动爻
  const changingIdxs = [];
  yaos.forEach((y, i) => { if (y.changing) changingIdxs.push(i); });
  const hasChange = changingIdxs.length > 0;

  // 变卦
  let bian = null;
  if (hasChange){
    const bianKey = yaos.map(y => {
      const v = y.changing ? !y.yang : y.yang;
      return v ? "1" : "0";
    }).join("");
    bian = HEX[bianKey];
  }

  // ---------- 组装 ----------
  let html = "";

  const q = questionEl.value.trim();
  html += `<div class="question-echo">`;
  if (q) html += `所问：<strong>${escapeHtml(q)}</strong><br>`;
  html += `类别：<strong>${catName}</strong></div>`;

  // 本卦卡
  html += `
    <div class="card">
      <div class="card-tag">本 卦 · 现 状</div>
      <div class="card-head">
        <div class="card-title">${ben.name}</div>
        <div class="card-num">第${cnNum(ben.n)}卦</div>
      </div>
      <div class="card-text">${ben.plain}</div>
      <div class="direct-badge ${levelClass(ben.level)}">直断：${ben.direct}（${ben.level}）</div>
      <div class="category-advice">
        <strong>【${catName}】</strong>${CATEGORY_ADVICE[cat][ben.level]}
      </div>
    </div>
  `;

  // 动爻 / 变卦
  if (hasChange){
    const names = changingIdxs.map(i => yaoName(i, yaos[i].yang)).join("、");
    html += `
      <div class="arrows">↓</div>
      <div class="card">
        <div class="card-tag red">动 爻 · 转 机</div>
        <div class="changing-note">
          动爻：${names}（共 ${changingIdxs.length} 爻）<br>
          卦由动生变，事情正在转化之中。${changingIdxs.length >= 3 ? "动爻较多，变化较剧烈，需谨慎应对。" : "重点留意动爻位置的提示。"}
        </div>
      </div>
      <div class="arrows">↓</div>
      <div class="card">
        <div class="card-tag">变 卦 · 趋 势</div>
        <div class="card-head">
          <div class="card-title">${bian.name}</div>
          <div class="card-num">第${cnNum(bian.n)}卦</div>
        </div>
        <div class="card-text">${bian.plain}</div>
        <div class="direct-badge ${levelClass(bian.level)}">直断：${bian.direct}（${bian.level}）</div>
        <div class="category-advice">
          <strong>【${catName}·趋势】</strong>${CATEGORY_ADVICE[cat][bian.level]}
        </div>
      </div>
    `;
  } else {
    html += `
      <div class="card">
        <div class="card-tag">六 爻 安 静</div>
        <div class="changing-note" style="border-left-color:rgba(201,169,97,.5); background:rgba(201,169,97,.05); color:var(--gold-dim);">
          此卦无动爻，事态相对稳定，以本卦为主断之即可。
        </div>
      </div>
    `;
  }

  resultEl.innerHTML = html;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ==========================================================
   八、事件绑定
   ========================================================== */
castBtn.addEventListener("click", startCast);

questionEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !state.busy){
    questionEl.blur();
    startCast();
  }
});
</script>
